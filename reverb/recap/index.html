<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The recap arrives in the link's #fragment, which is never sent to any server. Everything
         in it is shown as text, never as markup. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'none';
        script-src 'self' https://view.promontoryai.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://view.promontoryai.com;
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Meeting recap — ReVerb</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300685B' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z'/%3E%3Cpath d='M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8'/%3E%3C/svg%3E">
    <script src="../site.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light dark; --green: #00685B; --ink: #1d1d1f; --ink-2: #424245; --muted: #6e6e73; --line: #e5e5ea; --page: #f5f5f7; --paper: #ffffff; --wash: rgba(0,104,91,.06); --indigo: #4f46e5; }
        @media (prefers-color-scheme: dark) {
            :root { --green: #4cc3b2; --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #a1a1a6; --line: #38383a; --page: #000000; --paper: #1c1c1e; --wash: rgba(76,195,178,.12); --indigo: #9a95ff; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif; font-weight: 400; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        h1, h2, p, ul, dl { margin: 0; }
        .shell { max-width: 46rem; margin: 0 auto; padding: 0 16px; }
        header { background: var(--paper); border-bottom: 1px solid var(--line); }
        .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 60px; }
        .brand { display: inline-flex; align-items: center; gap: .5rem; color: var(--green); text-decoration: none; font-size: 1.25rem; font-weight: 400; }
        .brand svg { width: 24px; height: 24px; }
        .btn { display: inline-flex; align-items: center; min-height: 36px; padding: 0 .95rem; border: 1px solid var(--line); border-radius: 9999px; background: var(--paper); color: var(--ink-2); font: inherit; font-size: .875rem; cursor: pointer; }
        .btn:hover { border-color: var(--green); color: var(--green); }
        main.shell { padding-top: 32px; padding-bottom: 56px; }
        .paper { padding: 28px 24px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
        @media (min-width: 640px) { .paper { padding: 36px 40px 40px; } }
        .kicker { font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
        h1 { margin-top: .4rem; font-size: clamp(1.6rem, 4.5vw, 2.1rem); line-height: 1.2; font-weight: 400; letter-spacing: -.015em; }
        .meta { margin-top: .5rem; font-size: .875rem; color: var(--muted); }
        .headline { margin-top: 1.25rem; padding: .85rem 1rem; border-radius: 10px; background: var(--wash); color: var(--ink-2); }
        section { margin-top: 1.75rem; }
        h2 { font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
        ul { margin-top: .5rem; padding: 0; list-style: none; display: grid; gap: .45rem; }
        li { position: relative; padding-left: 1.4rem; color: var(--ink-2); }
        li::before { content: ''; position: absolute; left: .35rem; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--green); opacity: .55; }
        li.todo::before { content: '☐'; width: auto; height: auto; top: 0; left: 0; border-radius: 0; background: none; opacity: 1; color: var(--green); }
        li.todo.done::before { content: '☑'; }
        li.todo.done .what { text-decoration: line-through; color: #9ca3af; }
        .who { display: block; font-size: .8125rem; color: var(--muted); }
        dl { margin-top: .5rem; display: grid; gap: .55rem; }
        dt { font-weight: 500; color: var(--indigo); }
        dd { margin: 0; color: var(--ink-2); }
        .empty { padding: 48px 0; text-align: center; color: var(--muted); }
        footer { padding: 24px 0 calc(24px + env(safe-area-inset-bottom)); font-size: .8125rem; color: var(--muted); text-align: center; }
        footer a { color: var(--green); text-decoration: none; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <header>
        <div class="shell bar">
            <a class="brand" href="../">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" />
                </svg>
                ReVerb
            </a>
            <button class="btn" id="copy" type="button" hidden>Copy as text</button>
        </div>
    </header>
    <main class="shell">
        <article class="paper" id="recap" hidden></article>
        <p class="empty" id="empty" hidden>This link doesn’t contain a recap — it may have been cut short when it was pasted.</p>
    </main>
    <footer>Written by <a href="../">ReVerb</a>, a live meeting companion. AI-generated from the meeting — worth a check before you act on it.</footer>

    <script src="recap.js"></script>
</body>
</html>
